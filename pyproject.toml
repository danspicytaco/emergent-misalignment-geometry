[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emergent-misalignment-geometry"
version = "0.1.0"
description = "CPU analysis and saved-data replay for emergent misalignment geometry"
requires-python = ">=3.10"
dependencies = [
  "numpy", "scipy", "matplotlib", "pandas", "statsmodels", "scikit-learn",
  "requests", "httpx", "python-dotenv", "huggingface_hub>=1.33,<2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
